<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOKES Employability Skills Curriculum</title>
    <link rel="icon" href="SPOKES-Logo.png">
    <style>
        /* Faces are self-hosted (both SIL Open Font License, latin subset,
           49 KB total). A school content filter, a dead network, or a machine
           opening this file directly no longer silently swaps the headings for
           Georgia and the body for system sans. Verified loading over both
           http:// and file:// — same-directory woff2 is not CORS-blocked. */
        @font-face {
            font-family: "DM Serif Display";
            src: url("fonts/dm-serif-display-latin.woff2") format("woff2");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Outfit";
            src: url("fonts/outfit-latin.woff2") format("woff2");
            font-weight: 300 800;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --primary: #007baf;
            --accent: #37b550;
            --dark: #004071;
            --light: #FFFFFF;
            --muted: #EDF3F7;
            --gray: #60636b;
            --gold: #d3b257;
            --royal: #00133f;
            --mauve: #a7253f;
            --offwhite: #d1d3d4;
            --muted-gold: #ad8806;
            /* spacing scale — every gap on this page snaps to one of these */
            --s1: 0.25rem;
            --s2: 0.375rem;
            --s3: 0.5rem;
            --s4: 0.75rem;
            --s5: 1rem;
            --s6: 1.25rem;
            --s7: 1.5rem;
            --s8: 2rem;

            --font-heading: "DM Serif Display", Georgia, serif;
            --font-body: "Outfit", system-ui, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-body);
            color: var(--royal);
            background: linear-gradient(135deg, var(--light) 0%, var(--muted) 58%, rgba(211, 178, 87, 0.16) 100%);
            overflow-x: hidden;
        }

        a {
            color: inherit;
        }

        button,
        input {
            font: inherit;
        }

        .skip-link {
            position: absolute;
            left: 1rem;
            top: -4rem;
            z-index: 100;
            padding: var(--s4) var(--s5);
            border-radius: 0 0 8px 8px;
            background: var(--royal);
            color: var(--light);
            font-weight: 700;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .dashboard-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: var(--s4) clamp(var(--s5), 3vw, var(--s8)) var(--s5);
            color: var(--light);
            background:
                linear-gradient(125deg, rgba(0, 19, 63, 0.98), rgba(0, 64, 113, 0.96) 56%, rgba(0, 123, 175, 0.9));
            box-shadow: 0 10px 30px rgba(0, 19, 63, 0.14);
        }

        .hero::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 6px;
            background: linear-gradient(90deg,
                var(--primary) 0 16.66%,
                var(--mauve) 16.66% 33.33%,
                var(--accent) 33.33% 50%,
                var(--dark) 50% 66.66%,
                var(--muted-gold) 66.66% 83.33%,
                var(--gold) 83.33%);
        }

        .topbar,
        footer {
            width: min(1740px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .dashboard-main {
            width: min(1740px, calc(100% - 2rem));
            margin-inline: auto;
        }

        .topbar {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: var(--s5);
        }

        /* the right half of the band was empty; it now carries the one fact an
           instructor wants on arrival, in their language rather than the
           pipeline's — plus a hub link into Bespoke */
        .hero-tools {
            margin: 0 0 0 auto;
            padding-left: var(--s6);
            border-left: 1px solid rgba(255, 255, 255, 0.28);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: var(--s3);
        }

        .hero-count {
            margin: 0;
            color: var(--light);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .hero-count:empty { display: none; }

        .bespoke-link {
            display: inline-flex;
            align-items: center;
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            background: var(--gold);
            color: var(--royal);
            font-size: 0.85rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        .bespoke-link:hover {
            filter: brightness(1.05);
        }
        .bespoke-link:focus-visible {
            outline: 3px solid var(--light);
            outline-offset: 3px;
        }

        .brand-lockup {
            display: inline-flex;
            align-items: center;
            gap: var(--s6);
            min-width: 0;
        }

        .logo-frame {
            width: 112px;
            height: 70px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            padding: var(--s3) var(--s4);
            border-radius: 8px;
            background: var(--light);
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(0, 19, 63, 0.22);
        }

        .spokes-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform: translateY(-1px);
        }

        .hero-title {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-family: var(--font-heading);
            font-size: clamp(1.9rem, 2.6vw, 2.7rem);
            font-weight: 400;
            line-height: 1.05;
            letter-spacing: 0;
            color: var(--light);
        }

        .hero-note {
            margin: var(--s2) 0 0;
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(0.95rem, 1.2vw, 1.05rem);
        }

        .dashboard-main {
            position: relative;
            z-index: 2;
            flex: 1;
            margin-top: var(--s6);
            padding-bottom: var(--s8);
        }

        .noscript-list {
            margin: 0 0 var(--s5);
            padding: var(--s5) var(--s6);
            border: 1px solid rgba(0, 64, 113, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.94);
        }

        .noscript-list p {
            margin: 0 0 var(--s3);
            font-weight: 700;
            color: var(--dark);
        }

        .noscript-list ul {
            margin: 0;
            padding-left: 1.2rem;
        }

        .noscript-list li {
            margin: var(--s1) 0;
        }

        .noscript-list a {
            color: var(--primary);
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            /* three-up is the working default: it divides six evenly today and
               eighteen evenly later, and keeps the card near 400px wide */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: var(--s5);
        }

        .module-card {
            --card-accent: var(--primary);
            --card-soft: rgba(0, 123, 175, 0.1);
            position: relative;
            display: flex;
            min-height: 262px;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(0, 64, 113, 0.14);
            border-radius: 8px;
            color: var(--light);
            text-decoration: none;
            background: var(--royal);
            box-shadow: 0 18px 42px rgba(0, 64, 113, 0.1);
            animation: cardReveal 0.45s ease both;
            animation-delay: calc(var(--i, 0) * 65ms);
            transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
        }

        .module-card::before {
            content: "";
            position: absolute;
            inset: auto 0 0 0;
            height: 7px;
            background: var(--card-accent);
            z-index: 3;
        }

        .module-card::after {
            content: "";
            position: absolute;
            inset: 0 0 auto 0;
            height: 106px;
            background:
                linear-gradient(180deg, rgba(0, 19, 63, 0.04) 0%, rgba(0, 19, 63, 0.2) 100%);
            pointer-events: none;
            z-index: 1;
        }

        .module-card:hover {
            transform: translateY(-6px);
            border-color: rgba(0, 64, 113, 0.28);
            box-shadow: 0 28px 70px rgba(0, 64, 113, 0.16);
        }

        .module-card:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 4px;
        }

        .module-card--planned {
            cursor: default;
        }

        .module-card--planned:hover {
            transform: none;
        }

        .card-art {
            position: relative;
            min-height: 106px;
            flex: 0 0 106px;
            overflow: hidden;
            background: var(--card-soft);
        }

        .card-art img {
            width: 100%;
            height: 100%;
            min-height: 106px;
            display: block;
            object-fit: cover;
            object-position: var(--image-position, center);
            filter: saturate(0.94) contrast(1.02);
            transform: scale(1.01);
            transition: transform 0.45s ease, filter 0.45s ease;
        }

        .module-card:hover .card-art img {
            filter: saturate(1.06) contrast(1.06);
            transform: scale(1.055);
        }

        .card-body {
            position: relative;
            z-index: 2;
            display: flex;
            flex: 1;
            flex-direction: column;
            padding: var(--s4) var(--s4) var(--s3);
            background:
                linear-gradient(180deg, rgba(0, 19, 63, 0.98), rgba(0, 19, 63, 1));
        }

        .module-name {
            margin: 0;
            color: var(--light);
            font-family: var(--font-heading);
            font-size: clamp(1.1rem, 1.3vw, 1.34rem);
            font-weight: 400;
            line-height: 1.08;
            letter-spacing: 0;
            overflow-wrap: anywhere;
            text-wrap: balance;
        }

        .theme-communication .module-name {
            font-size: clamp(1rem, 1.18vw, 1.2rem);
            line-height: 1.06;
        }

        .module-desc {
            margin: var(--s2) 0 0;
            color: rgba(255, 255, 255, 0.86);
            font-size: 0.84rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-chips {
            display: flex;
            flex-wrap: wrap;
            gap: var(--s2);
            margin: var(--s4) 0 0;
            padding: 0;
            list-style: none;
        }

        .card-chips li {
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 999px;
            padding: var(--s1) var(--s3);
            color: rgba(255, 255, 255, 0.92);
            background: rgba(255, 255, 255, 0.08);
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .card-footer {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: var(--s4);
            padding: 0 var(--s4) var(--s4);
        }

        .launch-cta {
            display: inline-flex;
            align-items: center;
            gap: var(--s3);
            min-height: 44px;
            border-radius: 999px;
            padding: var(--s3) var(--s6);
            color: var(--button-text, var(--light));
            background: var(--button-accent, var(--card-accent));
            font-size: 0.86rem;
            font-weight: 700;
            letter-spacing: 0.005em;
            /* one shadow for all six colours, so a gold button carries the same
               optical weight as a mauve one */
            box-shadow: 0 2px 6px rgba(0, 19, 63, 0.28);
            transition: transform 0.24s ease, box-shadow 0.24s ease;
        }

        .module-card:hover .launch-cta {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 19, 63, 0.34);
        }

        .arrow-icon {
            line-height: 1;
            transition: transform 0.24s ease;
        }

        .module-card:hover .arrow-icon {
            transform: translateX(4px);
        }

        .planned-label {
            color: var(--gray);
            font-size: 0.92rem;
            font-weight: 800;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: var(--s8);
            border: 1px dashed rgba(0, 64, 113, 0.24);
            border-radius: 8px;
            color: var(--gray);
            background: rgba(255, 255, 255, 0.8);
            text-align: center;
            font-weight: 700;
        }

        footer {
            padding: 0 0 var(--s8);
            color: var(--gray);
            font-size: 0.9rem;
        }

        footer p {
            margin: 0;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(0, 64, 113, 0.16);
        }

        .offline-note {
            display: block;
            margin-top: 0.4rem;
            font-weight: 700;
            color: var(--dark);
        }

        .offline-note[hidden] {
            display: none;
        }

        .theme-time {
            --card-accent: var(--primary);
            --button-accent: var(--primary);
            --card-soft: rgba(0, 123, 175, 0.1);
        }

        .theme-interview {
            --card-accent: var(--mauve);
            --button-accent: var(--mauve);
            --card-soft: rgba(0, 19, 63, 0.1);
        }

        .theme-accountability {
            --card-accent: var(--accent);
            --button-accent: var(--accent);
            --button-text: var(--royal);
            --card-soft: rgba(55, 181, 80, 0.14);
        }

        .theme-communication {
            --card-accent: var(--primary);
            --button-accent: var(--dark);
            --card-soft: rgba(0, 123, 175, 0.1);
        }

        .theme-anger {
            --card-accent: var(--mauve);
            --button-accent: var(--muted-gold);
            --button-text: var(--royal);
            --card-soft: rgba(167, 37, 63, 0.1);
        }

        .theme-problemSolving {
            --card-accent: var(--muted-gold);
            --button-accent: var(--gold);
            --button-text: var(--royal);
            --card-soft: rgba(211, 178, 87, 0.18);
        }

        @keyframes cardReveal {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (min-width: 1501px) {
            .dashboard-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* below this the nowrap count starves the brand lockup, so it drops to
           its own line instead of squeezing the title */
        @media (max-width: 820px) {
            .topbar {
                flex-wrap: wrap;
            }

            .hero-tools {
                width: 100%;
                margin: var(--s3) 0 0;
                padding-left: 0;
                border-left: 0;
                align-items: flex-start;
            }

            .hero-count {
                width: auto;
            }
        }

        @media (max-width: 640px) {
            .hero {
                padding: var(--s4) var(--s5) var(--s5);
            }

            .brand-lockup {
                gap: var(--s4);
            }

            .logo-frame {
                width: 96px;
                height: 62px;
                padding: var(--s2) var(--s3);
            }

            h1 {
                font-size: clamp(1.35rem, 6.4vw, 1.8rem);
            }

            .dashboard-main {
                width: min(100% - 1rem, 1180px);
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .module-card {
                min-height: 0;
            }
        }
    </style>
</head>
<body>
    <a href="#dashboardGrid" class="skip-link">Skip to lessons</a>

    <div class="dashboard-shell">
        <header class="hero">
            <div class="topbar">
                <div class="brand-lockup">
                    <div class="logo-frame">
                        <img src="SPOKES-Logo.png" alt="SPOKES logo" class="spokes-logo">
                    </div>
                    <div class="hero-title">
                        <h1>Employability Skills Curriculum</h1>
                        <p class="hero-note">Interactive lessons for the classroom &mdash; choose one to launch.</p>
                    </div>
                </div>
                <div class="hero-tools">
                    <p class="hero-count" id="heroCount"></p>
                    <a class="bespoke-link" href="bespoke/index.html">Open Bespoke</a>
                </div>
            </div>
        </header>

        <main class="dashboard-main">
            <noscript>
                <div class="noscript-list">
                    <p>Lessons (JavaScript is off, so here are direct links):</p>
                    <ul>
                        <li><a href="bespoke/index.html">Bespoke (instructor design wizard)</a></li>
                        <li><a href="lesson-time-management/index.html">Time Management</a></li>
                        <li><a href="lesson-interview-skills/index.html">Interview Skills</a></li>
                        <li><a href="lesson-employee-accountability/index.html">Employee Accountability</a></li>
                        <li><a href="lesson-communicating-with-the-public/index.html">Communicating with the Public</a></li>
                        <li><a href="lesson-controlling-anger/index.html">Controlling Anger</a></li>
                        <li><a href="lesson-problem-solving-and-decision-making/index.html">Problem Solving &amp; Decision Making</a></li>
                    </ul>
                </div>
            </noscript>

            <div class="dashboard-grid" id="dashboardGrid"></div>
        </main>

        <footer>
            <p>&copy; 2026 WV Adult Basic Education. All rights reserved.
                <span class="offline-note" id="offlineNote" hidden>Showing the built-in lesson list (offline copy, last synced 2026-08-04).</span>
            </p>
        </footer>
    </div>

    <script>
        // Keep FALLBACK_LESSONS (and this sync date) in sync with
        // lesson-registry.json — this list is what file:// and offline users see.
        const FALLBACK_SYNCED = '2026-08-04';

        const FALLBACK_LESSONS = [
            {
                id: 'lesson-time-management',
                title: 'Time Management',
                description: 'Master prioritization, scheduling, and daily planning strategies for workplace success.',
                themeKey: 'time',
                path: 'lesson-time-management/index.html',
                status: 'ready',
                slides: 37,
                videos: 5,
                interactions: { implemented: 3 }
            },
            {
                id: 'lesson-interview-skills',
                title: 'Interview Skills',
                description: 'Build confidence and master techniques for successful job interviews.',
                themeKey: 'interview',
                path: 'lesson-interview-skills/index.html',
                status: 'ready',
                slides: 36,
                videos: 2,
                interactions: { implemented: 5 }
            },
            {
                id: 'lesson-employee-accountability',
                title: 'Employee Accountability',
                description: 'Develop personal responsibility, goal-setting, and professional growth habits.',
                themeKey: 'accountability',
                path: 'lesson-employee-accountability/index.html',
                status: 'ready',
                slides: 35,
                videos: 0,
                interactions: { implemented: 3 }
            },
            {
                id: 'lesson-communicating-with-the-public',
                title: 'Communicating with the Public',
                description: 'Master active listening, communication styles, congruent messaging, and self-advocacy.',
                themeKey: 'communication',
                path: 'lesson-communicating-with-the-public/index.html',
                status: 'qa',
                slides: 33,
                videos: 8,
                interactions: { implemented: 8 }
            },
            {
                id: 'lesson-controlling-anger',
                title: 'Controlling Anger',
                description: 'Recognize anger triggers and work through them with the Embrace-Express-Work Through framework.',
                themeKey: 'anger',
                path: 'lesson-controlling-anger/index.html',
                status: 'qa',
                slides: 33,
                videos: 4,
                interactions: { implemented: 6 }
            },
            {
                id: 'lesson-problem-solving-and-decision-making',
                title: 'Problem Solving & Decision Making',
                description: 'Apply structured frameworks, critical thinking, and group decision-making techniques.',
                themeKey: 'problemSolving',
                path: 'lesson-problem-solving-and-decision-making/index.html',
                status: 'qa',
                slides: 28,
                videos: 4,
                interactions: { implemented: 6 }
            }
        ];

        const LESSON_IMAGE_MAP = {
            'lesson-time-management': {
                src: 'lesson-time-management/images/toolbox.webp',
                alt: 'Colorful time management toolbox with planner, clock, and schedule tools',
                position: 'center'
            },
            'lesson-interview-skills': {
                src: 'lesson-interview-skills/images/handshake.webp',
                alt: 'Professional handshake representing interview readiness',
                position: 'center'
            },
            'lesson-employee-accountability': {
                src: 'lesson-employee-accountability/images/section-circles/intro-accountability.webp',
                alt: 'Workplace accountability illustration',
                position: 'center'
            },
            'lesson-communicating-with-the-public': {
                src: 'lesson-communicating-with-the-public/images/ppt-inspiration/image1.png',
                alt: 'Communication lesson visual from the presentation artwork',
                position: 'center'
            },
            'lesson-controlling-anger': {
                src: 'lesson-controlling-anger/images/anger-visuals/trigger-pressure.svg',
                alt: 'Pressure and trigger illustration for controlling anger',
                position: 'center'
            },
            'lesson-problem-solving-and-decision-making': {
                src: 'lesson-problem-solving-and-decision-making/images/ppt-inspired/you-decide.jpg',
                alt: 'Decision-making figure with arrows pointing in multiple directions',
                position: 'center'
            }
        };

        let allLessons = [];

        function normalizeStatus(status) {
            return String(status || 'planned').trim().toLowerCase();
        }

        function isLaunchable(status) {
            const statusKey = normalizeStatus(status);
            return statusKey === 'complete' || statusKey === 'ready' || statusKey === 'qa';
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, function (char) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[char];
            });
        }

        function sanitizeLessonPath(path) {
            const rawPath = String(path ?? '').trim();
            if (!rawPath) return '';
            if (!/^[A-Za-z0-9_./' -]+$/.test(rawPath)) return '';
            if (rawPath.startsWith('/') || rawPath.includes('..')) return '';
            if (!rawPath.toLowerCase().endsWith('.html')) return '';
            return encodeURI(rawPath);
        }

        function getThemeClass(themeKey, index) {
            const known = ['time', 'interview', 'accountability', 'communication', 'anger', 'problemSolving'];
            if (known.includes(themeKey)) return `theme-${themeKey}`;
            return ['theme-time', 'theme-problemSolving', 'theme-interview', 'theme-anger', 'theme-accountability'][index % 5];
        }

        function getLessonImage(lesson) {
            return LESSON_IMAGE_MAP[lesson.id] || {
                src: 'SPOKES-Logo.png',
                alt: 'SPOKES lesson artwork',
                position: 'center'
            };
        }

        function buildChips(lesson) {
            const chips = [];
            const slides = Number(lesson.slides);
            const videos = Number(lesson.videos);
            const activities = Number(lesson.interactions && lesson.interactions.implemented);
            if (Number.isFinite(slides) && slides > 0) chips.push(slides + ' slides');
            if (Number.isFinite(videos) && videos > 0) chips.push(videos + (videos === 1 ? ' video' : ' videos'));
            if (Number.isFinite(activities) && activities > 0) chips.push(activities + (activities === 1 ? ' activity' : ' activities'));
            if (!chips.length) return '';
            return `<ul class="card-chips">${chips.map(chip => `<li>${escapeHtml(chip)}</li>`).join('')}</ul>`;
        }

        function buildCard(lesson, index) {
            const launchable = isLaunchable(lesson.status);
            const safePath = launchable ? sanitizeLessonPath(lesson.path) : '';
            const isLaunchableLesson = launchable && !!safePath;
            const tag = isLaunchableLesson ? 'a' : 'div';
            const titleId = 'lesson-title-' + index;
            const hrefAttr = tag === 'a' ? ` href="${safePath}" aria-labelledby="${titleId}"` : '';
            const plannedClass = isLaunchableLesson ? '' : ' module-card--planned';
            const safeTitle = escapeHtml(lesson.title || 'Untitled Lesson');
            const safeDescription = escapeHtml(lesson.description || '');
            const lessonImage = getLessonImage(lesson);
            const imageSrc = escapeHtml(encodeURI(lessonImage.src));
            const imagePosition = escapeHtml(lessonImage.position || 'center');
            const footerContent = isLaunchableLesson
                ? `<span class="launch-cta">Launch Lesson <span class="arrow-icon" aria-hidden="true">&rarr;</span></span>`
                : `<span class="planned-label">Coming Soon</span>`;

            return `<${tag}${hrefAttr} class="module-card ${getThemeClass(lesson.themeKey, index)}${plannedClass}" style="--i: ${index}; --image-position: ${imagePosition};">
                <div class="card-art">
                    <img src="${imageSrc}" alt="" loading="lazy">
                </div>
                <div class="card-body">
                    <h3 class="module-name" id="${titleId}">${safeTitle}</h3>
                    <p class="module-desc">${safeDescription}</p>
                    ${buildChips(lesson)}
                </div>
                <div class="card-footer">${footerContent}</div>
            </${tag}>`;
        }

        function visibleLessons(lessons) {
            return (Array.isArray(lessons) ? lessons : []).filter(function (lesson) {
                return lesson && lesson.status !== 'blocked';
            });
        }

        function renderDashboard() {
            const lessons = visibleLessons(allLessons);
            const grid = document.getElementById('dashboardGrid');
            grid.innerHTML = lessons.length
                ? lessons.map((lesson, i) => buildCard(lesson, i)).join('')
                : '<div class="empty-state">No lessons found &mdash; the lesson registry may be empty or unreadable.</div>';

            // states the real number of launchable lessons, so the band stays
            // true as the curriculum grows
            const ready = lessons.filter(lesson => isLaunchable(lesson.status)).length;
            const counter = document.getElementById('heroCount');
            if (counter) {
                counter.textContent = ready
                    ? `${ready} ${ready === 1 ? 'lesson' : 'lessons'} available`
                    : '';
            }
        }

        function initDashboard(data) {
            allLessons = Array.isArray(data.lessons) ? data.lessons : FALLBACK_LESSONS;
            renderDashboard();
        }

        document.addEventListener('DOMContentLoaded', function () {
            fetch('lesson-registry.json', { cache: 'no-store' })
                .then(function (res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function (data) {
                    initDashboard(data);
                })
                .catch(function (error) {
                    // Be honest about the failure: label the page as the
                    // offline copy and leave maintainers a breadcrumb
                    console.warn('Lesson registry unavailable — showing the built-in offline copy (synced ' + FALLBACK_SYNCED + ').', error);
                    const offlineNote = document.getElementById('offlineNote');
                    if (offlineNote) offlineNote.hidden = false;
                    initDashboard({ lessons: FALLBACK_LESSONS });
                });
        });
    </script>
</body>
</html>
