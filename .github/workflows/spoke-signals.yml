name: Spoke Signals

# Opens a lesson-tagged PR from a Bespoke submission.
# Browser never holds a GitHub token — instructors open a labeled issue
# (or Britt runs workflow_dispatch with pasted JSON). GITHUB_TOKEN is
# Action-side only.

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Full Bespoke selection JSON (bespoke-selection/v1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    concurrency:
      group: spoke-signal-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (contains(github.event.issue.title, '[Spoke Signal]') ||
        contains(join(github.event.issue.labels.*.name, ','), 'spoke-signal')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract payload
        id: payload
        uses: actions/github-script@v7
        env:
          DISPATCH_PAYLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.payload_json || '' }}
        with:
          script: |
            const fs = require('fs');
            let raw = '';
            if (context.eventName === 'workflow_dispatch') {
              raw = process.env.DISPATCH_PAYLOAD || '';
            } else {
              const body = context.payload.issue.body || '';
              const fence = body.match(/<!-- bespoke-payload:begin -->[\s\S]*?```json\s*([\s\S]*?)```[\s\S]*?<!-- bespoke-payload:end -->/);
              if (fence) {
                raw = fence[1];
              } else {
                const alt = body.match(/```json\s*(\{[\s\S]*?"schema"\s*:\s*"bespoke-selection\/v1"[\s\S]*?\})\s*```/);
                if (!alt) {
                  core.setFailed('No bespoke-selection JSON payload found in issue body.');
                  return;
                }
                raw = alt[1];
              }
            }
            let data;
            try {
              data = JSON.parse(raw.trim());
            } catch (e) {
              core.setFailed('Invalid JSON payload: ' + e.message);
              return;
            }
            const out = require('path').join(process.env.RUNNER_TEMP, 'bespoke-payload.json');
            fs.writeFileSync(out, JSON.stringify(data, null, 2));
            core.setOutput('file', out);

      # GITHUB_TOKEN-created PR workflow runs require human approval. Validate
      # here before creating the proposal; still approve and run full PR CI.
      - name: Validate and build immutable submission files
        id: submission
        env:
          PAYLOAD_FILE: ${{ steps.payload.outputs.file }}
        run: |
          python3 scripts/validate-bespoke-selection.py "$PAYLOAD_FILE"
          python3 -m unittest discover -s scripts -p 'test_bespoke*.py' -v
          python3 scripts/bespoke-write-submission.py "$PAYLOAD_FILE" --github-output "$GITHUB_OUTPUT"

      - name: Create pull request
        id: proposal
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(bespoke): Spoke Signal for ${{ steps.submission.outputs.lesson_id }}"
          branch: bespoke-signal/${{ steps.submission.outputs.lesson_id }}/${{ steps.submission.outputs.submission_id }}
          add-paths: ${{ steps.submission.outputs.path }}/**
          reviewers: doclegg05
          title: "[Bespoke] ${{ steps.submission.outputs.lesson_id }} design choices (${{ steps.submission.outputs.date }})"
          body: |
            Spoke Signal from Bespoke.

            - Lesson: `${{ steps.submission.outputs.lesson_id }}`
            - Date: `${{ steps.submission.outputs.date }}`
            - Files: `${{ steps.submission.outputs.path }}/`

            **Merge = greenlight to build** (D10). Britt is the sole gate.
            This immutable design proposal does not build or publish a lesson.
            Confirm full team content, source access, and any earlier proposal for this lesson before approval.
            Selection validation and Bespoke regression tests ran in this workflow.
            Approve the GitHub-token-created PR workflow runs and require full quality before merging.

            ${{ github.event_name == 'issues' && format('Source issue: #{0}', github.event.issue.number) || 'Source: workflow_dispatch' }}
          labels: |
            bespoke
            spoke-signal
          draft: true

      - name: Comment on issue
        if: github.event_name == 'issues' && steps.proposal.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          PROPOSAL_URL: ${{ steps.proposal.outputs.pull-request-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Validated design proposal: ' + process.env.PROPOSAL_URL + '. Britt must review this draft before any lesson build. The intake template still needs the team’s full content.'
            });
