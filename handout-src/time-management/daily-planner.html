<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily Planner: SPOKES Time Management</title>
<style>
  @font-face { font-family: "DM Serif Display"; src: url("../../fonts/dm-serif-display-latin.woff2") format("woff2"); font-display: block; }
  @font-face { font-family: "Outfit"; src: url("../../fonts/outfit-latin.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
  :root { --font-heading: "DM Serif Display", serif; --font-body: "Outfit", sans-serif; }
</style>
<link rel="stylesheet" href="../spokes-handout.css">
<style>
  /* Daily Planner. Same sections and wording as the planner it replaces. */
  .date-row { display: flex; align-items: flex-end; gap: 0.35in; margin-top: 0.2in; }
  .date-row .field { flex: 1; }
  .days { display: flex; gap: 0.07in; }
  .days span {
    width: 0.3in;
    height: 0.3in;
    border: 1pt solid var(--offwhite);
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 9pt;
    font-weight: 600;
    color: var(--dark);
  }
  .planner { display: grid; grid-template-columns: 1.45fr 1fr; gap: 0.35in; margin-top: 0.3in; }
  .schedule { border-collapse: collapse; width: 100%; }
  .schedule th, .schedule td { border: 1pt solid var(--line); height: 0.355in; padding: 0 0.12in; }
  .schedule th {
    width: 1.05in;
    background: var(--muted);
    color: var(--dark);
    font-weight: 600;
    font-size: 9.5pt;
    text-align: left;
    white-space: nowrap;
  }
  .side { display: flex; flex-direction: column; gap: 0.28in; }
  .goal { height: 1.45in; }
  .notes { margin-top: 0.28in; }
  .notes .write-box { height: 1.68in; }
</style>
</head>
<body>
<main class="handout">
  <section class="sheet">
    <header class="handout-head">
      <img class="logo" src="../../SPOKES-Logo.png" alt="SPOKES, Skills for Life">
      <h1>Daily Planner</h1>
    </header>

    <div class="date-row">
      <div class="field"><span class="label">Date:</span><span class="rule"></span></div>
      <div class="days" aria-label="Circle the day">
        <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
      </div>
    </div>

    <div class="planner">
      <section>
        <h2>Today's Schedule</h2>
        <table class="schedule">
          <tbody>
            <tr><th scope="row">6-7 AM</th><td></td></tr>
            <tr><th scope="row">7-8 AM</th><td></td></tr>
            <tr><th scope="row">8-9 AM</th><td></td></tr>
            <tr><th scope="row">9-10 AM</th><td></td></tr>
            <tr><th scope="row">10-11 AM</th><td></td></tr>
            <tr><th scope="row">11 AM-noon</th><td></td></tr>
            <tr><th scope="row">noon-1 PM</th><td></td></tr>
            <tr><th scope="row">1-2 PM</th><td></td></tr>
            <tr><th scope="row">2-3 PM</th><td></td></tr>
            <tr><th scope="row">3-4 PM</th><td></td></tr>
            <tr><th scope="row">4-5 PM</th><td></td></tr>
            <tr><th scope="row">5-6 PM</th><td></td></tr>
            <tr><th scope="row">6-7 PM</th><td></td></tr>
            <tr><th scope="row">7-8 PM</th><td></td></tr>
            <tr><th scope="row">8-9 PM</th><td></td></tr>
          </tbody>
        </table>
      </section>

      <div class="side">
        <section>
          <h2>Top Priorities</h2>
          <ul class="check-rows"><li></li><li></li><li></li><li></li></ul>
        </section>
        <section>
          <h2>Today's Goal</h2>
          <div class="write-box goal"></div>
        </section>
        <section>
          <h2>Appointment</h2>
          <ul class="check-rows"><li></li><li></li><li></li><li></li></ul>
        </section>
      </div>
    </div>

    <section class="notes">
      <h2>Notes</h2>
      <div class="write-box ruled" style="--n: 5"></div>
    </section>

    <footer class="handout-foot">
      <span><strong>SPOKES</strong> Time Management</span>
      <span>Copyright &copy; 2026 WV Adult Basic Education</span>
    </footer>
  </section>
</main>
<script src="../lines.js"></script>
</body>
</html>
